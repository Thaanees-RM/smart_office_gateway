name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Cheapest, most reliable check: catches typos and syntax errors in
  # seconds, no privileges or bcc install needed.
  python-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python3 -m py_compile control_plane/sync_daemon.py control_plane/dashboard.py

  # Confirms the image actually builds - does not run the container,
  # since running it needs host privileges a CI runner shouldn't be
  # given (see docker-compose.yml).
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t smart-office-gateway .

  # Compiles ebpf/xdp_filter.c with bcc and loads it into the kernel -
  # this alone runs the eBPF verifier (the proposal names "passing the
  # eBPF verifier" as a critical success factor), without attaching to
  # any network interface, so it needs no real IoT hardware to be useful.
  #
  # This job is marked continue-on-error: GitHub-hosted runners are VMs
  # with a real kernel and normally allow this, but eBPF program loading
  # in a shared CI environment is inherently less predictable than the
  # two jobs above - a failure here is worth investigating, not treated
  # as a hard gate on merging.
  ebpf-verifier-check:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install bcc
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-bpfcc "linux-headers-$(uname -r)"
      - name: Compile and load xdp_firewall (verifier check only, no attach)
        run: |
          sudo python3 - <<'PYEOF'
          from bcc import BPF
          b = BPF(src_file="ebpf/xdp_filter.c")
          b.load_func("xdp_firewall", BPF.XDP)
          print("xdp_firewall compiled and passed the eBPF verifier")
          PYEOF
